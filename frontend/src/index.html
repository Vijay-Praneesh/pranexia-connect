<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Seyyon Connect</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="assets/seyyon-favicon.png" />
    <meta name="description" content="Seyyon Connect helps businesses manage customers, WhatsApp campaigns, templates and campaign insights in one platform. Built for businesses in Coimbatore, Tiruppur and across Tamil Nadu." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://seyyonconnect.in/" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:site_name" content="Seyyon Connect" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WhatsApp Business & Customer Engagement Software | Seyyon Connect" />
    <meta property="og:description" content="Seyyon Connect helps businesses manage customers, WhatsApp campaigns, templates and campaign insights in one platform. Built for businesses in Coimbatore, Tiruppur and across Tamil Nadu." />
    <meta property="og:url" content="https://seyyonconnect.in/" />
    <meta property="og:image" content="https://seyyonconnect.in/assets/meta-tag.png" />
    <meta property="og:image:alt" content="Seyyon Connect customer engagement platform" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WhatsApp Business & Customer Engagement Software | Seyyon Connect" />
    <meta name="twitter:description" content="Seyyon Connect helps businesses manage customers, WhatsApp campaigns, templates and campaign insights in one platform. Built for businesses in Coimbatore, Tiruppur and across Tamil Nadu." />
    <meta name="twitter:image" content="https://seyyonconnect.in/assets/meta-tag.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <app-root>
      <div id="initial-preloader" style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #ffffff; z-index: 99999;">
        <style>
          @keyframes initSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          @keyframes initPulse { 0%, 100% { transform: scale(0.95); opacity: 0.5; } 50% { transform: scale(1.15); opacity: 0.9; } }
          @keyframes initFavicon { 0% { transform: scale(0.94); } 100% { transform: scale(1.05); } }
        </style>
        <div style="position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: -4px; border-radius: 50%; background: radial-gradient(circle, rgba(249, 102, 20, 0.22) 0%, rgba(249, 102, 20, 0) 70%); animation: initPulse 1.8s ease-in-out infinite; pointer-events: none;"></div>
          <div style="position: absolute; inset: 0; border-radius: 50%; border: 3.5px solid rgba(249, 102, 20, 0.15); border-top-color: #f96614; border-right-color: #f68749; box-shadow: 0 2px 10px rgba(249, 102, 20, 0.18); animation: initSpin 0.95s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite; box-sizing: border-box;"></div>
          <div style="position: relative; z-index: 2; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; animation: initFavicon 1.9s ease-in-out infinite alternate;">
            <img src="assets/seyyon-favicon.png" alt="Seyyon Connect" style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(249, 102, 20, 0.25));" />
          </div>
        </div>
      </div>
    </app-root>
  </body>
</html>
