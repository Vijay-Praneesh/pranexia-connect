<main class="not-found-page" role="main">
  <!-- Background Glow & Grid Ornaments -->
  <div class="bg-ornaments" aria-hidden="true">
    <div class="glow-orb orb-primary"></div>
    <div class="glow-orb orb-secondary"></div>
    <div class="grid-pattern"></div>
  </div>

  <div class="not-found-container">
    <!-- Brand Logo in Upper Portion -->
    <div class="logo-wrapper">
      <a routerLink="/" class="logo-link" aria-label="Seyyon Connect Homepage">
        <img
          src="assets/seyyon-logo.png"
          alt="Seyyon Connect"
          class="brand-logo"
        />
      </a>
    </div>

    <!-- 404 Hero Visual Canvas -->
    <div class="visual-canvas" aria-hidden="true">
      <!-- Decorative Orbit Elements -->
      <div class="orbit-ring ring-outer"></div>
      <div class="orbit-ring ring-inner"></div>

      <!-- Floating SaaS & Message Accent Nodes -->
      <div class="floating-node node-1">
        <i class="bi bi-chat-dots-fill"></i>
      </div>
      <div class="floating-node node-2">
        <i class="bi bi-broadcast-pin"></i>
      </div>
      <div class="floating-node node-3">
        <i class="bi bi-shield-check"></i>
      </div>

      <!-- Centered 404 Display Typography -->
      <div class="display-404">
        <span class="digit">4</span>
        <span class="digit digit-center">
          <span class="radar-ping"></span>
          0
        </span>
        <span class="digit">4</span>
      </div>
    </div>

    <!-- Editorial Text Content -->
    <div class="content-block">
      <span class="eyebrow">SEYYON CONNECT</span>

      <h1 class="main-title">Oops! This page went off the grid.</h1>

      <p class="description">
        The page you're looking for doesn't exist or may have been moved. Let's get you back to Seyyon Connect.
      </p>

      <!-- CTA Actions -->
      <div class="actions-group">
        <a routerLink="/" class="btn-primary-orange" aria-label="Navigate back to Seyyon Connect homepage">
          <i class="bi bi-house-door-fill" aria-hidden="true"></i>
          <span>Back to Home</span>
        </a>

        <a routerLink="/products" class="btn-secondary-outline" aria-label="Explore Seyyon Connect products and features">
          <span>Explore Our Products</span>
          <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </a>
      </div>

      <!-- Helper Hint -->
      <p class="helper-text">
        <i class="bi bi-info-circle" aria-hidden="true"></i>
        <span>Try checking the URL or head back to the homepage.</span>
      </p>
    </div>
  </div>
</main>
