<header class="public-header" [class.scrolled]="isScrolled" role="banner">
  <div class="header-container">
    <!-- LEFT: SEYYON CONNECT LOGO -->
    <div class="header-left">
      <a routerLink="/" class="brand-link" (click)="closeMobileMenu()" aria-label="Seyyon Connect Home">
        <img
          src="assets/seyyon-logo.png"
          alt="Seyyon Connect"
          class="header-logo"
        />
      </a>
    </div>

    <!-- CENTER: DESKTOP NAVIGATION -->
    <nav class="header-center-nav" aria-label="Main Navigation">
      <ul class="nav-list" role="list">
        @for (item of navItems; track item.route) {
          <li class="nav-item">
            <a
              [routerLink]="item.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: !!item.exact }"
              class="nav-link"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- RIGHT: ACTION BUTTONS (LOGIN + GET STARTED + MOBILE TOGGLE) -->
    <div class="header-right-actions">
      <a routerLink="/login" class="btn-action-login">
        Login
      </a>
      <a routerLink="/login" class="btn-action-primary">
        <span>Get Started</span>
      </a>

      <!-- Mobile Hamburger Button -->
      <button
        type="button"
        class="mobile-toggle-btn"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen"
        [attr.aria-label]="mobileMenuOpen ? 'Close navigation' : 'Open navigation'"
      >
        <i class="bi" [class.bi-list]="!mobileMenuOpen" [class.bi-x-lg]="mobileMenuOpen" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <!-- MOBILE NAVIGATION DRAWER & OVERLAY -->
  @if (mobileMenuOpen) {
    <div class="mobile-menu-backdrop" (click)="closeMobileMenu()" aria-hidden="true"></div>
    <div class="mobile-menu-drawer" role="dialog" aria-modal="true" aria-label="Mobile Navigation">
      <div class="mobile-drawer-body">
        <ul class="mobile-nav-list" role="list">
          @for (item of navItems; track item.route) {
            <li class="mobile-nav-item">
              <a
                [routerLink]="item.route"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: !!item.exact }"
                class="mobile-nav-link"
                (click)="closeMobileMenu()"
              >
                <span>{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>

        <div class="mobile-divider"></div>

        <!-- Mobile Actions -->
        <div class="mobile-actions-stack">
          <a
            routerLink="/login"
            class="mobile-btn-login"
            (click)="closeMobileMenu()"
          >
            Login
          </a>
          <a
            routerLink="/login"
            class="mobile-btn-primary"
            (click)="closeMobileMenu()"
          >
            <span>Get Started</span>
          </a>
        </div>
      </div>
    </div>
  }
</header>
